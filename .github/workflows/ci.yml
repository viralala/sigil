name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: crypto-core spike contract (must stay 20/20)
        run: node --test spikes/crypto-core/sigil.test.js
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: e2e + axe (mobile and desktop)
        run: pnpm e2e
        env:
          CI: "1"
          SIGIL_DB_URL: ${{ secrets.SIGIL_DB_URL }}
          SIGIL_MASTER_KEY: ${{ secrets.SIGIL_MASTER_KEY }}
          SIGIL_SESSION_SECRET: ${{ secrets.SIGIL_SESSION_SECRET }}
          SIGIL_ROOT_PUBS: ${{ secrets.SIGIL_ROOT_PUBS }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
